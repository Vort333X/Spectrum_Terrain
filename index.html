<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Spectrum Terrain · 频谱地形</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <aside class="panel" aria-label="频谱控制">
    <header class="brand">
      <svg class="mark" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="m3 19 5-6 4 3 5-8 8 11M3 23l5-4 4 2 5-5 8 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="tag">3D AUDIO SPECTRUM</span>
      <h1>Spectrum<br> Terrain<span>.</span></h1>
      <p>频谱地形</p>
    </header>

    <section class="controls" aria-labelledby="source-label">
      <h2 id="source-label">音频来源</h2>
      <div class="source"><i></i><span id="source" role="status">演示信号</span></div>
      <button type="button" class="primary" id="monitor" aria-describedby="monitor-hint" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h2.3l1.6-4.3 2.5 8.6 2.1-6 1.3 1.7h3.2"/></svg>
        <span id="monitor-label">监听系统音频</span>
      </button>
      <p class="monitor-hint" id="monitor-hint">在共享窗口勾选「共享系统音频」。</p>
    </section>

    <section class="controls" aria-labelledby="palette-label">
      <h2 id="palette-label">配色</h2>
      <div class="swatches">
        <button type="button" class="swatch ember" data-palette="ember" aria-label="紫橙" title="紫橙" aria-pressed="false"></button>
        <button type="button" class="swatch jade" data-palette="jade" aria-label="翡翠绿" title="翡翠绿" aria-pressed="true"></button>
        <button type="button" class="swatch silver" data-palette="silver" aria-label="银灰" title="银灰" aria-pressed="false"></button>
      </div>
    </section>

    <section class="controls" aria-labelledby="camera-label">
      <h2 id="camera-label">视角</h2>
      <div class="row">
        <button type="button" id="orbit" aria-pressed="true">自动绕转</button>
        <button type="button" id="reset">复位</button>
      </div>
    </section>

    <details class="controls effects">
      <summary>效果调试</summary>
      <div class="effects-body">
        <label class="test-source" for="test-signal">测试信号
          <select id="test-signal">
            <option value="demo">演示</option>
            <option value="sweep">对数扫频</option>
            <option value="pulse">双频脉冲</option>
          </select>
        </label>
        <form id="effects">
          <label class="effect-check"><input type="checkbox" name="axes" data-effect checked> 显示坐标轴</label>
          <label class="effect-range">曲面不透明度 <span class="effect-value" aria-hidden="true"></span>
            <input type="range" name="opacity" data-effect data-unit="%" min="0" max="100" value="78">
          </label>
          <label class="effect-range">后方保留亮度 <span class="effect-value" aria-hidden="true"></span>
            <input type="range" name="trail" data-effect data-unit="%" min="0" max="100" value="18">
          </label>
          <label class="effect-range">光晕强度 <span class="effect-value" aria-hidden="true"></span>
            <input type="range" name="glow" data-effect data-unit="%" min="0" max="100" value="55">
          </label>
          <label class="effect-range">光晕半径 <span class="effect-value" aria-hidden="true"></span>
            <input type="range" name="radius" data-effect data-unit=" px" min="2" max="20" value="8">
          </label>
          <label class="effect-range">强度增益 <span class="effect-value" aria-hidden="true"></span>
            <input type="range" name="gain" data-effect data-unit="%" min="25" max="300" step="5" value="100">
          </label>
          <label class="effect-range">频率平滑 <span class="effect-value" aria-hidden="true"></span>
            <input type="range" name="smoothing" data-effect data-unit="%" min="0" max="80" value="50">
          </label>
          <label class="effect-range">绕转速度 <span class="effect-value" aria-hidden="true"></span>
            <input type="range" name="orbitspeed" data-effect data-unit=" °/s" min="0" max="30" value="9">
          </label>
          <label class="effect-check"><input type="checkbox" id="freeze"> 冻结频谱</label>
          <button type="reset" id="reset-effects">恢复默认效果</button>
        </form>
      </div>
    </details>

    <footer class="panel-foot">255 曲面列 <span>·</span> 2.5 秒历史</footer>
  </aside>

  <main id="stage" aria-label="实时三维频谱瀑布图">
    <div class="stage-header" aria-hidden="true"><span>实时频谱</span><span class="stage-index">SPECTRAL HISTORY</span><span id="fps">— FPS</span></div>
    <div id="axes" aria-hidden="true"></div>
    <p class="hint">拖动旋转 <span>·</span> 滚轮缩放</p>
    <p id="stage-error" role="alert" hidden>无法初始化三维场景。请检查浏览器的图形加速设置。</p>
  </main>
  <script src="./spectrum-terrain.js"></script>
</body>
</html>
