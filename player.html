<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>立体播放页 · Spectrum Terrain</title>
  <link rel="stylesheet" href="./player.css">
</head>
<body>
  <main class="player">
    <header class="player-header">
      <div class="player-brand">
        <svg aria-hidden="true" viewBox="0 0 32 32" fill="none">
          <path d="M3 21l6-4 5 2 6-9 9 11M3 26l6-4 5 2 6-8 9 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <span>SPECTRUM TERRAIN</span>
          <strong>立体播放页</strong>
        </div>
      </div>
      <div class="player-actions">
        <button id="monitor" type="button" aria-pressed="false">监听系统音频</button>
        <button id="choose-cover" type="button">更换封面</button>
        <button id="reset-view" type="button">恢复视角</button>
        <input id="cover-file" type="file" accept="image/*" hidden>
      </div>
    </header>

    <section id="stage" class="player-stage" aria-label="专辑封面与三维频谱">
      <div id="axes" aria-hidden="true"></div>
      <div class="stage-caption">
        <span class="source-label"><i></i><span id="source">演示频谱</span></span>
        <span class="stage-hint">拖动旋转 · 滚轮缩放</span>
      </div>
      <p id="status" role="status" hidden></p>
      <p id="stage-error" role="alert" hidden>无法初始化三维场景，请检查浏览器的图形加速设置。</p>
    </section>

    <footer class="player-footer">
      <div class="track-info" aria-live="polite">
        <span class="eyebrow">正在播放</span>
        <h1 id="track-title">潮汐信号</h1>
        <p id="track-subtitle">TIDAL SIGNAL · 演示曲目</p>
      </div>

      <div class="transport">
        <div class="transport-buttons">
          <button id="previous" type="button" aria-label="上一首演示曲目" title="上一首演示曲目">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6v12M18 6l-9 6 9 6z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="play" type="button" data-playing="true" aria-label="暂停频谱动画">
            <svg class="play-icon" aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M9 5.5 19 12 9 18.5z"/></svg>
            <svg class="pause-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6v12m6-12v12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
          <button id="next" type="button" aria-label="下一首演示曲目" title="下一首演示曲目">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6v12M6 6l9 6-9 6z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="timeline">
          <span id="elapsed">0:00</span>
          <input id="progress" type="range" min="0" max="42" value="0" step="0.01" aria-label="演示进度">
          <span id="duration">0:42</span>
        </div>
      </div>

      <div class="cover-colors">
        <span class="eyebrow">封面取色</span>
        <div id="track-palette" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </footer>
  </main>
  <script src="./player.js"></script>
</body>
</html>
